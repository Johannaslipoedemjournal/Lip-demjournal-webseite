---
layout: default
---
<div style="max-width:760px;margin:0 auto;padding:52px 32px 72px;">
  <a href="/" style="font-weight:700;font-size:14.5px;">← Zur Startseite</a>
  <h1 style="font-family:'Newsreader',serif;font-weight:500;font-size:42px;margin:22px 0 6px;">{{ page.titel }}</h1>
  <div style="font-size:13.5px;color:#998A62;margin-bottom:26px;">Stand: {{ page.stand }}</div>
  {%- if page.vorlage %}
  <div style="background:#F3E6CC;border:1px solid #E2D3A6;border-radius:14px;padding:16px 20px;font-size:14px;color:#5E5327;margin-bottom:34px;">
    <strong>Hinweis:</strong> Dies ist eine Vorlage nach aktuellem Standard. Bitte ersetze alle <em>[Platzhalter]</em> durch deine echten Angaben und lass die Texte im Zweifel rechtlich prüfen.
  </div>
  {%- endif %}
  <div class="rechtstext">
{{ content }}
  </div>
</div>
