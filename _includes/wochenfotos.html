<section class="wochenfotos">
  <h2>Kleine Einblicke</h2>
  <div class="wochenfotos-leiste">
    {% assign fotos = site.data.wochenfotos %}
    {% for foto in fotos %}
    <figure>
      <img src="{{ foto.bild | relative_url }}" alt="{{ foto.alt }}" loading="lazy">
      <figcaption>{{ foto.text }}</figcaption>
    </figure>
    {% endfor %}
  </div>
</section>

<style>
.wochenfotos { margin: 4rem 0 2rem; }
.wochenfotos h2 { font-family: 'Newsreader', serif; font-weight: 400; }
.wochenfotos-leiste {
  display: grid; grid-auto-flow: column;
  grid-auto-columns: max(160px, calc((100% - 4rem) / 5));
  gap: 1rem; overflow-x: auto;
  scroll-snap-type: x mandatory; padding-bottom: .5rem;
}
.wochenfotos figure { margin: 0; scroll-snap-align: start; }
.wochenfotos img {
  width: 100%; aspect-ratio: 3/4; object-fit: cover;
  border-radius: 18px; display: block;
}
.wochenfotos figcaption {
  font-family: 'Mulish', sans-serif; font-size: .9rem;
  margin-top: .5rem; text-align: center;
}
</style>
