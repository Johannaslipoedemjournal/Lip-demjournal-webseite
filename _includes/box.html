<div style="background:#FFFCF2;border:1px solid #EADFC1;border-radius:16px;padding:22px 26px;margin:0 0 20px;">
  {%- if include.titel and include.titel != "" %}
  <div style="font-family:'Mulish',sans-serif;font-weight:700;font-size:17px;color:#A66E1F;margin-bottom:8px;">{{ include.titel }}</div>
  {%- endif %}
  {%- if include.text and include.text != "" %}
  <p style="font-size:18px;line-height:1.65;margin:0;">{{ include.text }}</p>
  {%- endif %}
</div>
