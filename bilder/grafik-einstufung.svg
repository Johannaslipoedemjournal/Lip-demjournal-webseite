<svg width="900" height="1180" viewBox="0 0 900 1180" xmlns="http://www.w3.org/2000/svg" font-family="'Mulish', sans-serif" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    
  </defs>

  <rect width="900" height="1180" fill="#f7f1e6"></rect>

  <circle cx="850" cy="60" r="70" fill="#e8c9a0" opacity="0.4"></circle>
  <circle cx="60" cy="1120" r="90" fill="#c17f4c" opacity="0.15"></circle>

  <text x="60" y="80" class="heading" font-size="34">Wie wird ein Lipödem eingestuft?</text>
  <text x="60" y="112" class="sub" font-size="16">Nach der aktuellen S2k-Leitlinie</text>

  <rect x="60" y="160" width="780" height="420" rx="28" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.5"></rect>
  <text x="96" y="210" class="label" font-size="24">Stadieneinteilung</text>
  <text x="96" y="236" class="sub" font-size="15">Beschreibt ausschließlich die Optik des Gewebes – nicht die Schwere der Beschwerden</text>

  <rect x="96" y="266" width="708" height="90" rx="16" fill="#faf6ec" stroke="#e8c9a0" stroke-width="1"></rect>
  <circle cx="140" cy="311" r="24" fill="#c17f4c"></circle>
  <text x="140" y="319" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Newsreader', serif">I</text>
  <text x="184" y="304" class="label" font-size="19">Stadium I</text>
  <text x="184" y="330" class="sub" font-size="15">Glatte Hautoberfläche, feinknotige bis kleinlobuläre Struktur</text>

  <rect x="96" y="368" width="708" height="90" rx="16" fill="#faf6ec" stroke="#e8c9a0" stroke-width="1"></rect>
  <circle cx="140" cy="413" r="24" fill="#c17f4c"></circle>
  <text x="140" y="421" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Newsreader', serif">II</text>
  <text x="184" y="406" class="label" font-size="19">Stadium II</text>
  <text x="184" y="432" class="sub" font-size="15">Unebene Hautoberfläche, grobknotige Struktur, größere Dellen</text>

  <rect x="96" y="470" width="708" height="90" rx="16" fill="#faf6ec" stroke="#e8c9a0" stroke-width="1"></rect>
  <circle cx="140" cy="515" r="24" fill="#c17f4c"></circle>
  <text x="140" y="523" text-anchor="middle" font-size="20" fill="#ffffff" font-family="'Newsreader', serif">III</text>
  <text x="184" y="508" class="label" font-size="19">Stadium III</text>
  <text x="184" y="534" class="sub" font-size="15">Ausgeprägte Umfangsvermehrung, grobe Gewebelappen (Wammen)</text>

  <text x="96" y="600" class="note" font-size="14">Zwei Frauen im gleichen Stadium können völlig unterschiedliche Schmerzen erleben.</text>

  <rect x="60" y="640" width="780" height="300" rx="28" fill="#ffffff" stroke="#e8dcc4" stroke-width="1.5"></rect>
  <text x="96" y="690" class="label" font-size="24">Lokalisation</text>
  <text x="96" y="716" class="sub" font-size="15">Rein beschreibend – eine feste Typ-Nummerierung (I–V) gilt nicht mehr als leitliniengerecht</text>

  <rect x="96" y="746" width="336" height="150" rx="16" fill="#faf6ec" stroke="#e8c9a0" stroke-width="1"></rect>
  <text x="264" y="800" text-anchor="middle" class="label" font-size="20">Beine</text>
  <text x="264" y="826" text-anchor="middle" class="sub" font-size="14">Gesäß / Hüfte bis</text>
  <text x="264" y="846" text-anchor="middle" class="sub" font-size="14">zum Knöchel</text>
  <text x="264" y="874" text-anchor="middle" class="note" font-size="13">Hände und Füße bleiben ausgespart</text>

  <rect x="468" y="746" width="336" height="150" rx="16" fill="#faf6ec" stroke="#e8c9a0" stroke-width="1"></rect>
  <text x="636" y="800" text-anchor="middle" class="label" font-size="20">Arme</text>
  <text x="636" y="826" text-anchor="middle" class="sub" font-size="14">Bei einem Teil der</text>
  <text x="636" y="846" text-anchor="middle" class="sub" font-size="14">Betroffenen zusätzlich</text>
  <text x="636" y="874" text-anchor="middle" class="note" font-size="13">meist zusammen mit den Beinen</text>

  <text x="96" y="920" class="note" font-size="14">Quelle: S2k-Leitlinie Lipödem, AWMF-Registernummer 037-012, Version 5.0 (2024)</text>

  <line x1="60" y1="990" x2="840" y2="990" stroke="#e8c9a0" stroke-width="1"></line>
  <text x="450" y="1030" text-anchor="middle" class="sub" font-size="14" fill="#9c8a6b">Johanna's Lipödem Journal</text>
</svg>